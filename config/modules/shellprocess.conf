---
# Commandes post-installation executees dans le systeme installe (chroot)
dontChroot: false
timeout: 300

script:
  # Activer le depot archimedeaos dans le systeme installe
  - command: "/bin/sh -c 'grep -q archimedeaos /etc/pacman.conf || printf \"\\n[archimedeaos]\\nInclude = /etc/pacman.d/archimedeaos-mirrorlist\\n\" >> /etc/pacman.conf'"
    timeout: 10

  # Synchroniser les bases de paquets
  - command: "/usr/bin/pacman -Syy --noconfirm"
    timeout: 120
